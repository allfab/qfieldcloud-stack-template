# /opt/docker/qfieldcloud-stack/docker-compose.override.yml
# Le SEUL fichier Compose qui m'appartient. Charge en dernier (voir COMPOSE_FILE).
services:

  nginx:
    # Ou publier nginx. Deux cas :
    #  - frontal sur CETTE machine   -> WEB_BIND_IP=127.0.0.1
    #  - frontal sur une AUTRE machine -> WEB_BIND_IP=<IP de cet hote>
    # On evite 0.0.0.0, qui ferait ecouter nginx jusque sur les bridges Docker.
    # Le port clair reste sur loopback : personne n'a a l'atteindre de l'exterieur.
    ports: !override
      - "127.0.0.1:${WEB_HTTP_PORT}:80"
      - "${WEB_BIND_IP}:${WEB_HTTPS_PORT}:443"
    # Les conteneurs QGIS ephemeres rappellent l'API pour telecharger les fichiers
    # du projet, et doivent passer par nginx (X-Accel-Redirect). Or nginx n'accepte
    # qu'un seul en-tete Host : QFIELDCLOUD_HOST. On lui donne ce nom sur le reseau.
    networks:
      default:
        aliases:
          - ${QFIELDCLOUD_HOST}

  db:
    # Base de l'application : accessible pour les dumps, pas depuis le LAN.
    ports: !override
      - "127.0.0.1:5433:5432"
    # Les chemins relatifs d'un fichier Compose sont resolus depuis le
    # REPERTOIRE DE PROJET (src/, celui du premier fichier de COMPOSE_FILE),
    # pas depuis le fichier qui les ecrit. D'ou le `../` : sans lui, les
    # sauvegardes atterriraient dans le sous-module.
    volumes:
      - ../backups:/backups
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.sauvegarde-db.schedule: "0 30 2 * * *"
      ofelia.job-exec.sauvegarde-db.no-overlap: "true"
      ofelia.job-exec.sauvegarde-db.command: >-
        sh -c 'set -e;
        pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc
        -f "/backups/db/qfieldcloud-$$(date +%Y%m%d-%H%M).dump";
        find /backups/db -name "qfieldcloud-*.dump" -mtime +14 -delete;
        ls -l /backups/db | tail -3'
    # L'override standalone journalise TOUTES les requetes (log_statement=all).
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_destination=stderr
      - -c
      - shared_buffers=256MB

  rustfs:
    # RETIRE : le stockage objet est sorti de la machine (cluster Garage sur
    # 10.10.20.21). Les objets ont ete mirroites, `mc diff` est vide, et le
    # volume `rustfs_data` est conserve quelques jours en repli.
    profiles: ["never"]
    # L'API S3 ne peut PAS aller sur 127.0.0.1 : l'endpoint_url de STORAGES
    # (http://172.17.0.1:8009) est recopie tel quel dans les URL presignees, que
    # nginx ET les conteneurs QGIS ephemeres doivent pouvoir atteindre. On la
    # publie donc sur la passerelle docker0 : joignable de tout conteneur et de
    # l'hote, invisible depuis le LAN. La console web, elle, reste sur loopback.
    ports: !override
      - "${STORAGE_API_BIND_IP}:${OBJECT_STORAGE_API_PORT}:9000"
      - "${STORAGE_CONSOLE_BIND_IP}:${OBJECT_STORAGE_BROWSER_PORT}:9001"

  smtp4dev:
    # Piege a courriels de developpement : il n'envoie rien et ne doit rien
    # recevoir de l'exterieur. L'application l'atteint par le reseau Compose
    # (EMAIL_HOST=smtp4dev), pas par ces ports.
    ports: !override
      - "${SMTP4DEV_BIND_IP}:${SMTP4DEV_WEB_PORT}:80"
      - "${SMTP4DEV_BIND_IP}:${SMTP4DEV_SMTP_PORT}:25"
      - "${SMTP4DEV_BIND_IP}:${SMTP4DEV_IMAP_PORT}:143"

  webdav:
    # Meme logique que rustfs : s'il sert un jour de stockage d'attachements,
    # c'est WEBDAV_SERVER_NAMES ("172.17.0.1,webdav") qui dit par ou. Rien de
    # tout cela ne passe par le LAN.
    ports: !override
      - "${WEBDAV_BIND_IP}:${WEBDAV_PUBLIC_PORT}:80"

  certbot:
    # Le TLS public est termine par le frontal, qui detient un certificat
    # Let's Encrypt (wildcard *.webgis.allfabox.fr). Ce certbot-la n'a donc
    # jamais rien a emettre : son /etc/letsencrypt est vide et il boucle sur
    # `certbot renew` toutes les 12 h pour rien.
    # `profiles` est une liste : la valeur ci-dessous s'ajoute a celles du
    # sous-module (il n'en a aucune), et un service porteur d'un profil non
    # active n'est pas demarre. C'est la facon de RETIRER un service upstream
    # sans editer une ligne de src/.
    profiles: ["never"]

  createbuckets:
    # RETIRE avec rustfs : c'est le seul service qui en dependait. Le bucket
    # Garage est cree une fois a la main, et la cle applicative porte
    # `Can create buckets: false` — ce service echouerait de toute facon.
    profiles: ["never"]
