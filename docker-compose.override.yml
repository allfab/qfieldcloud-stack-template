# /opt/docker/qfieldcloud-stack/docker-compose.override.yml
# Le SEUL fichier Compose qui m'appartient. Chargé en dernier (voir COMPOSE_FILE).

# Plafonds de journalisation. L'upstream n'en pose que sur cinq services (app et
# nginx à 1000m × 10, soit 9,8 Go chacun ; qgis3, qgis4 et worker_wrapper à
# 100m × 10). Les autres — db, ofelia, memcached, webdav — n'en
# déclarent aucun et retombent sur le défaut du démon, c'est-à-dire json-file
# SANS limite. Le total de 22,5 Go souvent cité est donc un plancher, pas un
# plafond. On borne ici les services que Compose gère.
#
# Ce que ce fichier ne peut PAS couvrir : les conteneurs QGIS éphémères, créés
# par worker_wrapper via l'API Docker et non par Compose. Eux ne connaissent que
# le défaut du démon. Le filet global se pose donc dans /etc/docker/daemon.json,
# sur la machine — voir la section « Journalisation » du README.
x-logging-cap: &logging-cap
  options:
    max-size: "100m"
    max-file: "5"

services:

  app:
    # Ofelia frappe à la porte de django-cron toutes les minutes en amont, ce qui
    # relance un bootstrap Django complet (~2,7 s de CPU : import de l'app,
    # connexion DB, init django-axes) 1440 fois par jour pour une instance à
    # quelques utilisateurs. Sur morpheus, ce pic bref suffit à faire monter le
    # ventilateur CPU de 2000 à 2400 RPM une fois par minute.
    #
    # On espace à l'heure. Chaque classe de CRON_CLASSES garde sa propre
    # fréquence (django-cron ne l'exécute que si son délai est écoulé), donc le
    # seul effet est un RETARD, jusqu'à 1 h, sur :
    #   - qfieldcloud.send_notifications                     (était : 1 min)
    #   - qfieldcloud.set_terminated_workers_to_final_status  (était : 3 min)
    # Ne PAS aller au-delà d'une heure : delete_obsolete_project_packages ne
    # balaye que les projets modifiés dans les 70 dernières minutes ; à 2 h il
    # laisserait passer des packages obsolètes définitivement non nettoyés.
    labels:
      ofelia.job-exec.runcrons.schedule: "@every 1h"
    # Thème : la surcouche de réglages et les images, montées en lecture seule.
    # `DJANGO_SETTINGS_MODULE=qfieldcloud.settings_custom` (dans .env) fait
    # charger le premier ; le second devient le dossier `custom/` du statique.
    #
    # THÈME ACTIF — c'est l'état livré par ce template. Ces trois lignes se
    # recommentent avec celle de worker_wrapper et le DJANGO_SETTINGS_MODULE de
    # .env, jamais l'une sans les autres : le gabarit charge `custom/theme.css`
    # de lui-même, sans rien demander aux réglages Django, donc le laisser monté
    # garde la palette du thème. Voir « Revenir au thème de l'upstream », README.
    #
    # PORTAIL UTILISATEUR — les deux dernières lignes. L'upstream ne livre
    # aucune page pour un compte non-staff ; `portal` est une application
    # Django à nous, et `urls_custom.py` l'URLconf qui la met devant celle de
    # l'upstream. Les deux vont ensemble, et avec l'INSTALLED_APPS et le
    # ROOT_URLCONF de theme/settings_custom.py. Voir « Portail », README.
    volumes:
      - ../theme/settings_custom.py:/usr/src/app/qfieldcloud/settings_custom.py:ro
      - ../theme/static:/usr/src/app/qfieldcloud/core/staticfiles/custom:ro
      - ../theme/account-base.html:/usr/src/app/qfieldcloud/core/templates/account/base.html:ro
      - ../theme/portal:/usr/src/app/qfieldcloud/portal:ro
      - ../theme/urls_custom.py:/usr/src/app/qfieldcloud/urls_custom.py:ro
    # 9,8 Go d'origine, pour l'application la plus bavarde de la pile.
    logging: *logging-cap

  nginx:
    # Où publier nginx. Deux cas :
    #  - frontal sur CETTE machine     -> WEB_BIND_IP=127.0.0.1
    #  - frontal sur une AUTRE machine -> WEB_BIND_IP=<IP de cet hôte>
    # On évite 0.0.0.0, qui ferait écouter nginx jusque sur les bridges Docker.
    # Le port clair reste sur loopback : personne n'a à l'atteindre de l'extérieur.
    ports: !override
      - "127.0.0.1:${WEB_HTTP_PORT}:80"
      - "${WEB_BIND_IP}:${WEB_HTTPS_PORT}:443"
    # Les conteneurs QGIS éphémères rappellent l'API pour télécharger les fichiers
    # du projet, et doivent passer par nginx (X-Accel-Redirect). Or nginx n'accepte
    # qu'un seul en-tête Host : QFIELDCLOUD_HOST. On lui donne ce nom sur le réseau.
    networks:
      default:
        aliases:
          - ${QFIELDCLOUD_HOST}
    # 9,8 Go d'origine, alors qu'un journal d'accès se lit rarement au-delà
    # d'une semaine.
    logging: *logging-cap

  db:
    # Base de l'application : accessible pour les dumps, pas depuis le LAN.
    ports: !override
      - "127.0.0.1:5433:5432"
    # Les chemins relatifs d'un fichier Compose sont résolus depuis le
    # RÉPERTOIRE DE PROJET (src/, celui du premier fichier de COMPOSE_FILE),
    # pas depuis le fichier qui les écrit. D'où le `../` : sans lui, les
    # sauvegardes atterriraient dans le sous-module.
    volumes:
      - ../backups:/backups
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup-db.schedule: "0 30 2 * * *"
      ofelia.job-exec.backup-db.no-overlap: "true"
      ofelia.job-exec.backup-db.command: >-
        sh -c 'set -e;
        pg_dump -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc
        -f "/backups/db/qfieldcloud-$$(date +%Y%m%d-%H%M).dump";
        find /backups/db -name "qfieldcloud-*.dump" -mtime +14 -delete;
        ls -l /backups/db | tail -3'
    # L'override standalone journalise TOUTES les requêtes (log_statement=all).
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_destination=stderr
      - -c
      - shared_buffers=256MB
    # Aucun plafond en amont : le service qui journalise les requêtes était le
    # seul à pouvoir remplir le disque sans limite.
    logging: *logging-cap

  rustfs:
    # RETIRÉ : le stockage objet est sorti de la machine (serveur Garage sur
    # 10.10.20.21). Les objets ont été miroités, `mc diff` est vide, et le
    # volume `rustfs_data` est conservé quelques jours en repli.
    #
    # Il portait ici un `ports:` qui publiait l'API S3 sur la passerelle docker0
    # plutôt que sur le loopback : l'endpoint_url de STORAGES est recopié tel
    # quel dans les URL présignées, que nginx ET les conteneurs QGIS éphémères
    # doivent pouvoir atteindre. Cette contrainte vaut toujours — elle est
    # simplement satisfaite ailleurs, par l'adresse de Garage dans STORAGES.
    profiles: ["never"]

  smtp4dev:
    # RETIRÉ : le courrier part par un vrai relais (EMAIL_HOST dans .env), pas
    # par le piège à courriels de développement. Le volume `smtp4dev_data` ne
    # contient que les messages capturés avant la bascule.
    #
    # Il portait ici un `ports:` qui gardait SMTP et IMAP sur le loopback et ne
    # laissait sortir que l'interface web : celle-ci n'a AUCUNE authentification
    # et donne à lire les liens de réinitialisation de mot de passe. À remonter
    # tel quel si ce service revient un jour.
    profiles: ["never"]

  webdav:
    # Le seul service de stockage encore debout, et il ne sert rien pour
    # l'instant : STORAGES ne déclare aucune entrée WebDAV. S'il sert un jour de
    # stockage d'attachements, c'est WEBDAV_SERVER_NAMES ("172.17.0.1,webdav")
    # qui dira par où. On le publie sur la passerelle docker0, pas sur le LAN.
    ports: !override
      - "${WEBDAV_BIND_IP}:${WEBDAV_PUBLIC_PORT}:80"
    logging: *logging-cap

  certbot:
    # Le TLS public est terminé par le frontal, qui détient un certificat
    # Let's Encrypt (wildcard *.webgis.allfabox.fr). Ce certbot-là n'a donc
    # jamais rien à émettre : son /etc/letsencrypt est vide et il boucle sur
    # `certbot renew` toutes les 12 h pour rien.
    # `profiles` est une liste : la valeur ci-dessous s'ajoute à celles du
    # sous-module (il n'en a aucune), et un service porteur d'un profil non
    # activé n'est pas démarré. C'est la façon de RETIRER un service upstream
    # sans éditer une ligne de src/.
    profiles: ["never"]

  createbuckets:
    # RETIRÉ avec rustfs : c'est le seul service qui en dépendait. Le bucket
    # Garage est créé une fois à la main, et la clé applicative porte
    # `Can create buckets: false` — ce service échouerait de toute façon.
    profiles: ["never"]

  # Services que l'upstream laisse sans plafond de journalisation. Rien d'autre
  # à leur dire : seule la politique de journaux change.
  memcached:
    logging: *logging-cap

  ofelia:
    logging: *logging-cap

  worker_wrapper:
    # Même module de réglages que l'app : il lui faut donc le même fichier.
    # THÈME ACTIF, voir `app`. Se recommente avec lui, jamais tout seul :
    # sans ce fichier, le worker ne démarre pas sous `settings_custom`.
    # Le portail ne lui sert à rien, mais son module de réglages déclare
    # l'application et l'URLconf : sans ces deux montages, Django refuse de
    # démarrer sur un `ModuleNotFoundError`.
    volumes:
      - ../theme/settings_custom.py:/usr/src/app/qfieldcloud/settings_custom.py:ro
      - ../theme/portal:/usr/src/app/qfieldcloud/portal:ro
      - ../theme/urls_custom.py:/usr/src/app/qfieldcloud/urls_custom.py:ro
    logging: *logging-cap

  # Les deux services à usage unique : ils tournent au démarrage puis sortent,
  # mais mirror_transformation_grids recopie 847 Mo et sait être bavard.
  mirror_transformation_grids:
    logging: *logging-cap

  mkcert:
    logging: *logging-cap
