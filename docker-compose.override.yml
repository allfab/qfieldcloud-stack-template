# /opt/docker/qfieldcloud-stack/docker-compose.override.yml
# Le SEUL fichier Compose qui m'appartient. Charge en dernier (voir COMPOSE_FILE).
services:

  nginx:
    # L'instance est derriere un frontal Traefik, qui vit sur une autre machine
    # (10.99.99.10) et tape sur https://10.10.20.70:8443. Le port TLS doit donc
    # etre joignable depuis le LAN -- mais on le lie a la seule IP du LXC, pas a
    # 0.0.0.0 : ni loopback superflu, ni ecoute sur les bridges Docker.
    # Le port clair (8480) reste sur loopback : personne n'a a l'atteindre.
    ports: !override
      - "127.0.0.1:8480:80"
      - "10.10.20.70:8443:443"
    # Les conteneurs QGIS ephemeres rappellent l'API pour telecharger les fichiers
    # du projet, et doivent passer par nginx (X-Accel-Redirect). Or nginx n'accepte
    # qu'un seul en-tete Host : QFIELDCLOUD_HOST. On lui donne ce nom sur le reseau.
    networks:
      default:
        aliases:
          - qfieldcloud.webgis.allfabox.fr

  db:
    # Base de l'application : accessible pour les dumps, pas depuis le LAN.
    ports: !override
      - "127.0.0.1:5433:5432"
    # L'override standalone journalise TOUTES les requetes (log_statement=all).
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_destination=stderr
      - -c
      - shared_buffers=256MB
