# /opt/docker/qfieldcloud-stack/docker-compose.override.yml
# Le SEUL fichier Compose qui m'appartient. Chargé en dernier (voir COMPOSE_FILE).
services:

  nginx:
    # L'instance est derrière un frontal Traefik : rien à publier sur le LAN.
    ports: !override
      - "127.0.0.1:8480:80"
      - "127.0.0.1:8443:443"

  db:
    # Base de l'application : accessible pour les dumps, pas depuis le LAN.
    ports: !override
      - "127.0.0.1:5433:5432"
    # L'override standalone journalise TOUTES les requetes (log_statement=all).
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_destination=stderr
      - -c
      - shared_buffers=256MB
